    <text style="font: 8.3px 'DejaVu Sans'; text-anchor: start" x="627.345628" y="102.576786" transform="rotate(-0 627.345628 102.576786)">MAE 0.9875   RMSE 1.1716</text>
   </g>
   <g id="text_15">
    <text style="font: 8.3px 'DejaVu Sans'; text-anchor: start" x="499.379889" y="152.359116" transform="rotate(-0 499.379889 152.359116)">MAE 0.5764   RMSE 0.8387   [fitted on evaluation outcomes]</text>
   </g>
   <g id="text_16">
    <text style="font: 8.3px 'DejaVu Sans'; text-anchor: start" x="486.959911" y="202.141446" transform="rotate(-0 486.959911 202.141446)">MAE 0.5365   RMSE 0.7723   [fitted on evaluation outcomes]</text>
   </g>
   <g id="text_17">
    <text style="font: 8.3px 'DejaVu Sans'; text-anchor: start" x="467.623809" y="251.923777" transform="rotate(-0 467.623809 251.923777)">MAE 0.4744   RMSE 0.7995</text>
   </g>
  </g>
  <g id="text_18">
   <text style="fill: #0b0b0b; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="7.92" y="11.062125" transform="rotate(-0 7.92 11.062125)">PF-F2. Where the website's wind MAE of 0.5365 m/s comes from</text>
  </g>
  <g id="text_19">
   <text style="fill: #52514e; font: 9px 'DejaVu Sans'; text-anchor: start" x="7.92" y="24.334594" transform="rotate(-0 7.92 24.334594)">Regression provenance (validate_model_multioutput.py at W1 commit 1fd1ef9), reproduced exactly; not a W1 neural result</text>
  </g>
  <g id="text_20">
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(7.92 331.659787)">Model: deployed W1 (SHA-256 f2db5aa9…9d14b0), historical scoring procedure (_w1_recall_floor.py: pooled scaled_weather inputs, 32-day windows); X1 =</text>
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(7.92 340.743094)">same-date mean of the three stations' scores; warning if X1 ≥ 0.601 (threshold unchanged).</text>
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(7.92 349.62615)">Truth: processed_weather wind of the target day (forward-filled), as used by the website script. MOS: linear + isotonic, per station × season (Jun-Nov</text>
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(7.92 358.709456)">/ Dec-May), 8-fold TimeSeriesSplit over evaluation rows; 399 rows calibrated by a fallback fitted on later evaluation rows. Blend weight chosen by</text>
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(7.92 367.592512)">5-fold TimeSeriesSplit MAE on evaluation rows; its partner is the observation two days before the target (script indexing).</text>
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(7.92 376.475569)">MASE 0.6782 uses an in-sample lag-365 denominator from training rows (0.7912 m/s); MASE &lt; 1 does not mean the forecast beats a same-case baseline. The</text>
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(7.92 385.358625)">website's wind-direction row (43.40°) comes from a separate direction-only model.</text>
  </g>
 </g>
