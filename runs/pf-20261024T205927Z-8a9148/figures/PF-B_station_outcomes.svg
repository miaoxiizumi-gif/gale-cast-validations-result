  <g id="text_40">
   <text style="fill: #0b0b0b; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="8.64" y="10.882125" transform="rotate(-0 8.64 10.882125)">PF-B. Hits, misses, false alarms and correct negatives by station (website scorecard cases)</text>
  </g>
  <g id="text_41">
   <text style="fill: #52514e; font: 9px 'DejaVu Sans'; text-anchor: start" x="8.64" y="22.714594" transform="rotate(-0 8.64 22.714594)">Evidence A: website historical scorecard cases (overall evidence)</text>
  </g>
  <g id="text_42">
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(8.64 304.923094)">Model: deployed W1 (SHA-256 f2db5aa9…9d14b0), historical scoring procedure (_w1_recall_floor.py: pooled scaled_weather inputs, 32-day windows); X1 =</text>
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(8.64 314.0064)">same-date mean of the three stations' scores; warning if X1 ≥ 0.601 (threshold unchanged).</text>
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(8.64 322.889456)">Cases: the website's 3,423 next-day windows, NAIA, Sangley Point and Science Garden (1,141 each); target dates 2021-11-16 to 2024-12-30; lead +1 day.</text>
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(8.64 331.772513)">Study label: wind ≥ 10.8 m/s OR same-station 24-h MSLP fall ≥ 3 hPa (processed values, as on the website); all 28 positives are pressure falls, 0</text>
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(8.64 340.655569)">wind-triggered.</text>
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(8.64 349.538625)">X1 is a network-wide score: on any date the decision is identical at all three stations.</text>
  </g>
