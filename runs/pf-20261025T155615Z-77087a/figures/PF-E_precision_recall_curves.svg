   <text style="fill: #52514e; font: 9px 'DejaVu Sans'; text-anchor: start" x="6.192" y="27.574594" transform="rotate(-0 6.192 27.574594)">Evidence A: website historical scorecard cases (overall evidence)</text>
  </g>
  <g id="text_23">
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(6.192 385.733925)">Model: deployed GALE-CAST Model-W1 (SHA-256 f2db5aa9…9d14b0), historical scoring procedure (_w1_recall_floor.py: pooled scaled_weather inputs, 32-day</text>
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(6.192 394.817231)">windows); X1 = same-date mean of the three stations' scores; warning if X1 ≥ 0.601 (threshold unchanged).</text>
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(6.192 403.700288)">Cases: the website's 3,423 next-day windows, NAIA, Sangley Point and Science Garden (1,141 each); target dates 2021-11-16 to 2024-12-30; lead +1 day.</text>
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(6.192 412.583344)">Study label: wind ≥ 10.8 m/s OR same-station 24-h MSLP fall ≥ 3 hPa (processed values, as on the website); all 28 positives are pressure falls, 0</text>
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(6.192 421.4664)">wind-triggered.</text>
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(6.192 430.349456)">Baselines: event persistence = label of the issue day; event climatology = station × month label frequency, 2015-01-02 to 2020-10-14, warning if ≥</text>
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(6.192 439.232512)">0.0355 (chosen on 2020-10-15 to 2021-10-14 only).</text>
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(6.192 448.115569)">GALE-CAST Model-W1 scores come from a model trained with focal loss, class weights and oversampling; they are rankings, not calibrated probabilities</text>
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(6.192 456.998625)">(Brier skill vs climatology -3.44).</text>
  </g>
 </g>
