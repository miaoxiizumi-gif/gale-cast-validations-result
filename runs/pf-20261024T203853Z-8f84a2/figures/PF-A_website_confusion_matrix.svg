  <g id="text_33">
   <text style="fill: #0b0b0b; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="6.48" y="11.422125" transform="rotate(-0 6.48 11.422125)">PF-A. The website's historical W1 scorecard, exactly as shown</text>
  </g>
  <g id="text_34">
   <text style="fill: #52514e; font: 9px 'DejaVu Sans'; text-anchor: start" x="6.48" y="27.574594" transform="rotate(-0 6.48 27.574594)">Evidence A: website historical scorecard cases (overall evidence)</text>
  </g>
  <g id="text_35">
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(6.48 403.299787)">Model: deployed W1 (SHA-256 f2db5aa9…9d14b0), historical scoring procedure (_w1_recall_floor.py: pooled scaled_weather inputs, 32-day windows); X1 =</text>
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(6.48 412.383094)">same-date mean of the three stations' scores; warning if X1 ≥ 0.601 (threshold unchanged).</text>
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(6.48 421.26615)">Cases: the website's 3,423 next-day windows, NAIA, Sangley Point and Science Garden (1,141 each); target dates 2021-11-16 to 2024-12-30; lead +1 day.</text>
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(6.48 430.149206)">Study label: wind ≥ 10.8 m/s OR same-station 24-h MSLP fall ≥ 3 hPa (processed values, as on the website); all 28 positives are pressure falls, 0</text>
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(6.48 439.032263)">wind-triggered.</text>
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(6.48 447.915319)">Identity: all 9 false alarms and 4 misses match the original W1-branch record nine_fp_report.json by station, date and score. Retrospective: the</text>
   <text style="fill: #52514e; font: 7.2px 'DejaVu Sans'" transform="translate(6.48 456.998625)">threshold rule and X1 were adopted after test-period results were seen; not an independent test.</text>
  </g>
